# Controla tipos y compila el panel en cada PR y en cada cambio de main.
# Si no compila, el PR queda en rojo y no conviene mergearlo: Cloudflare publica lo que llega a main.

name: Compilar panel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Acciones oficiales de GitHub, fijadas por commit (no por etiqueta movible).
      - name: Bajar el código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (versiones fijas del package-lock)
        run: npm ci

      - name: Control de tipos y compilación
        run: npm run build
